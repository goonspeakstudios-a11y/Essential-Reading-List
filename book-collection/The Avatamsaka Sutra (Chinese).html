<div class="subNote" style="margin:4px auto 4px auto;"><span id="nofooter"><b>華嚴經</b>的版本包括：</span></div>
<ul><li><a href="/wiki/%E5%A4%A7%E6%96%B9%E5%BB%A3%E4%BD%9B%E8%8F%AF%E5%9A%B4%E7%B6%93%E5%85%AD%E5%8D%81%E5%8D%B7" title="大方廣佛華嚴經六十卷">六十華嚴</a>，東晉佛馱跋陀羅譯。又稱《<a href="/wiki/%E8%88%8A%E8%8F%AF%E5%9A%B4" class="mw-redirect" title="舊華嚴">舊華嚴</a>》、《晉經》。</li>
<li><a href="/wiki/%E5%A4%A7%E6%96%B9%E5%BB%A3%E4%BD%9B%E8%8F%AF%E5%9A%B4%E7%B6%93%E5%85%AB%E5%8D%81%E5%8D%B7" title="大方廣佛華嚴經八十卷">八十華嚴</a>，唐于闐實叉難陀譯。又稱《<a href="/wiki/%E6%96%B0%E8%8F%AF%E5%9A%B4" class="mw-redirect" title="新華嚴">新華嚴</a>》、《唐經》。</li>
<li><a href="/wiki/%E5%A4%A7%E6%96%B9%E5%BB%A3%E4%BD%9B%E8%8F%AF%E5%9A%B4%E7%B6%93%E5%9B%9B%E5%8D%81%E5%8D%B7" title="大方廣佛華嚴經四十卷">四十華嚴</a>，唐般若譯。卷第四十全稱「大方廣佛華嚴經入不思議解脫境界普賢行願品」，略稱「普賢行願品」，又稱《貞元經》。</li></ul>
